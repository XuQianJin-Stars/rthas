[package]
name = "rthas-ebpf-prog"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rthas-ebpf-prog"
path = "src/main.rs"

[dependencies]
aya-ebpf = "0.1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3

# Standalone crate: not a workspace member, so `cargo test --workspace`
# never tries to compile this for the host target.
[workspace]
