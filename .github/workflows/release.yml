# One-file rthas CLI for GitHub Releases (Linux embeds rthas-ebpf).
#
# Two waves of two: Linux first, then Darwin. Intel macOS is cross-compiled
# on macos-latest (Apple Silicon) — macos-13 runners queue for a long time.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rthas-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: rthas-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly (eBPF program)
        run: bash scripts/ci-bpf-toolchain.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact }}

      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: cargo binstall bpf-linker
        run: cargo binstall --no-confirm --force bpf-linker

      - name: Build helper and embed into CLI
        run: |
          set -euo pipefail
          cargo build -p rthas-ebpf --release --locked
          strip target/release/rthas-ebpf || true
          export RTHAS_EMBED_EBPF="${PWD}/target/release/rthas-ebpf"
          cargo build -p rthas-cli --release --locked
          strip target/release/rthas || true
          cp target/release/rthas "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  darwin:
    name: ${{ matrix.artifact }}
    needs: linux
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - artifact: rthas-darwin-arm64
            target: aarch64-apple-darwin
          - artifact: rthas-darwin-amd64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact }}

      - name: Build CLI
        run: |
          set -euo pipefail
          cargo build -p rthas-cli --release --locked --target "${{ matrix.target }}"
          strip "target/${{ matrix.target }}/release/rthas" || true
          cp "target/${{ matrix.target }}/release/rthas" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: [linux, darwin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum rthas-* | tee SHA256SUMS
          cp ../install.sh .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rthas-linux-amd64
            dist/rthas-linux-arm64
            dist/rthas-darwin-amd64
            dist/rthas-darwin-arm64
            dist/install.sh
            dist/SHA256SUMS
          generate_release_notes: true
