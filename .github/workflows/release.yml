# One-file rthas CLI for GitHub Releases (Linux embeds rthas-ebpf).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: rthas-linux-amd64
            embed: true
          - os: ubuntu-24.04-arm
            artifact: rthas-linux-arm64
            embed: true
          - os: macos-latest
            artifact: rthas-darwin-arm64
            embed: false
          - os: macos-13
            artifact: rthas-darwin-amd64
            embed: false
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly (eBPF program)
        if: matrix.embed
        run: bash scripts/ci-bpf-toolchain.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.artifact }}

      - name: Install bpf-linker
        if: matrix.embed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: cargo binstall bpf-linker
        if: matrix.embed
        run: cargo binstall --no-confirm --force bpf-linker

      - name: Build helper and embed into CLI
        if: matrix.embed
        run: |
          set -euo pipefail
          cargo build -p rthas-ebpf --release --locked
          strip target/release/rthas-ebpf || true
          export RTHAS_EMBED_EBPF="${PWD}/target/release/rthas-ebpf"
          cargo build -p rthas-cli --release --locked
          strip target/release/rthas || true
          cp target/release/rthas "${{ matrix.artifact }}"

      - name: Build CLI only
        if: ${{ !matrix.embed }}
        run: |
          set -euo pipefail
          cargo build -p rthas-cli --release --locked
          strip target/release/rthas || true
          cp target/release/rthas "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum rthas-* | tee SHA256SUMS
          cp ../install.sh .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rthas-linux-amd64
            dist/rthas-linux-arm64
            dist/rthas-darwin-amd64
            dist/rthas-darwin-arm64
            dist/install.sh
            dist/SHA256SUMS
          generate_release_notes: true
