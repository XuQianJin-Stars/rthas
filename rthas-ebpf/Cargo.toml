[package]
name = "rthas-ebpf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "eBPF uprobe helper for attaching rthas to uninstrumented processes"
publish = false

[lib]
name = "rthas_ebpf"
path = "src/lib.rs"

[[bin]]
name = "rthas-ebpf"
path = "src/main.rs"

[dependencies]
goblin = "0.8"
rustc-demangle = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.build-dependencies]
anyhow = "1"
